info:
  name: admins-lists
  type: http
  seq: 10

http:
  method: GET
  url: https://sanitriver-backend.ddev.site/api/admin/admins
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 401-example
    request:
      url: https://sanitriver-backend.ddev.site/api/admin/admins
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: cache-control
          value: no-cache, private
        - name: content-type
          value: application/json; charset=utf-8
        - name: date
          value: Wed, 18 Nov 2026 15:42:48 GMT
        - name: server
          value: nginx
        - name: vary
          value: Origin
        - name: transfer-encoding
          value: chunked
      body:
        type: json
        data: |-
          {
            "message": "Unauthenticated."
          }
